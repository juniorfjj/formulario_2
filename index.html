<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Formulário de Pesquisa</h1>
  <div class="subtitle">Preencha os campos abaixo. Campos com * são obrigatórios.</div>

  <form id="surveyForm">
    <label class="required" for="nome">Nome</label>
    <input type="text" id="nome" name="nome" required>

    <label class="required" for="telefone">Telefone</label>
    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>

    <label for="instagram">Instagram</label>
    <input type="text" id="instagram" name="instagram" placeholder="@seuusuario">

    <label style="margin-top:28px;">Apoia os candidatos:</label>

    <div class="candidate-block">
      <div class="candidate-name">Cícero</div>
      <div class="radio-row">
        <label class="radio-option"><input type="radio" name="cicero" value="Sim" required> Sim</label>
        <label class="radio-option"><input type="radio" name="cicero" value="Não"> Não</label>
      </div>
    </div>

    <div class="candidate-block">
      <div class="candidate-name">Mersinho</div>
      <div class="radio-row">
        <label class="radio-option"><input type="radio" name="mersinho" value="Sim" required> Sim</label>
        <label class="radio-option"><input type="radio" name="mersinho" value="Não"> Não</label>
      </div>
    </div>

    <div class="candidate-block">
      <div class="candidate-name">Hervazio</div>
      <div class="radio-row">
        <label class="radio-option"><input type="radio" name="hervazio" value="Sim" required> Sim</label>
        <label class="radio-option"><input type="radio" name="hervazio" value="Não"> Não</label>
      </div>
    </div>

    <div class="candidate-block">
      <div class="candidate-name">Veneziano</div>
      <div class="radio-row">
        <label class="radio-option"><input type="radio" name="veneziano" value="Sim" required> Sim</label>
        <label class="radio-option"><input type="radio" name="veneziano" value="Não"> Não</label>
      </div>
    </div>

    <label class="required" for="cidade" style="margin-top:28px;">Vota em qual cidade?</label>
    <input type="text" id="cidade" name="cidade" list="cidades-pb" placeholder="Comece a digitar o nome da cidade..." autocomplete="off" required>
    <datalist id="cidades-pb"></datalist>
    <div class="field-hint" id="cidadeHint">Carregando lista de municípios da Paraíba...</div>
    <div class="field-error" id="cidadeError">Selecione uma cidade válida da lista sugerida.</div>

    <div class="consent">
      <input type="checkbox" id="consent" required>
      <label for="consent" style="font-weight:400; margin:0;">
        Autorizo o uso das informações acima exclusivamente para fins desta pesquisa, conforme a Lei Geral de Proteção de Dados (LGPD).
      </label>
    </div>

    <button type="submit" id="submitBtn">Enviar</button>
  </form>
  <div id="msg" class="msg hidden"></div>
</div>

<script src="script.js"></script>
</body>
</html>
